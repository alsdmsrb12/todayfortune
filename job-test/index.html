<style>
  :root{
    --paper:#efe3c3;
    --paper-card:#faf4e3;
    --ink:#2b241d;
    --ink-soft:#5c5346;
    --jade:#4f6f52;
    --jade-dark:#38502f;
    --danchung:#a63a32;
    --gold:#c89b3c;
    --navy:#33506b;
    --line: rgba(43,36,29,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(200,155,60,0.14), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(79,111,82,0.14), transparent 55%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Noto Serif KR', serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 24px 56px;
    position:relative;
    overflow-x:hidden;
  }
  .page-wrap{ width:100%; max-width:460px; display:flex; flex-direction:column; align-items:center; }

  /* ---- 배경 장식 ---- */
  .bg-deco{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bg-frame{
    position:fixed; inset:14px; pointer-events:none; z-index:1;
    border:1px solid rgba(166,58,50,0.35);
  }
  .bg-frame::before{
    content:""; position:absolute; inset:6px; border:1px solid rgba(200,155,60,0.35);
  }
  .bg-moon{
    position:fixed; top:-60px; right:-60px; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(200,155,60,0.35), rgba(200,155,60,0.05) 70%);
    z-index:0;
  }
  .bg-branch{
    position:fixed; top:20px; right:40px; width:180px; height:180px; z-index:0; opacity:0.5;
  }
  .bg-mountain{
    position:fixed; left:0; right:0; bottom:0; height:130px; z-index:0; opacity:0.14;
  }
  .bg-lattice{
    position:fixed; left:-40px; bottom:-40px; width:220px; height:220px; z-index:0; opacity:0.15;
    background-image:
      repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 34px),
      repeating-linear-gradient(-45deg, var(--ink) 0 2px, transparent 2px 34px);
  }

  .stage{ width:100%; max-width:460px; position:relative; z-index:2; }
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow:0 1px 2px rgba(43,36,29,0.06), 0 16px 40px rgba(43,36,29,0.16);
    padding:44px 30px 34px;
    position:relative;
    animation:fadeIn 0.45s ease both;
  }
  .card::before{
    content:"";
    position:absolute; inset:9px;
    border:1px solid rgba(43,36,29,0.18);
    pointer-events:none;
  }
  .card::after{
    content:"";
    position:absolute; top:0; left:0; right:0; height:5px;
    background:repeating-linear-gradient(90deg,
      var(--danchung) 0 12px, var(--gold) 12px 18px,
      var(--jade) 18px 30px, var(--navy) 30px 34px, var(--paper-card) 34px 36px);
  }
  .corner{ position:absolute; width:16px; height:16px; z-index:3; }
  .corner.tl{ top:-1px; left:-1px; border-top:2px solid var(--danchung); border-left:2px solid var(--danchung); }
  .corner.tr{ top:-1px; right:-1px; border-top:2px solid var(--danchung); border-right:2px solid var(--danchung); }
  .corner.bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--danchung); border-left:2px solid var(--danchung); }
  .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--danchung); border-right:2px solid var(--danchung); }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .screen{display:none;}
  .screen.active{display:block;}

  .eyebrow{ font-size:12px; letter-spacing:0.35em; color:var(--danchung); text-align:center; margin:10px 0 14px; }
  h1.title{ font-family:'Song Myung', serif; font-size:30px; line-height:1.35; text-align:center; margin:0 0 10px; color:var(--ink); }
  .subtitle{ text-align:center; color:var(--ink-soft); font-size:14px; margin:0 0 26px; line-height:1.7; }
  .divider{ width:44px; height:1px; background:var(--gold); margin:0 auto 24px; }
  .job-preview{ display:flex; justify-content:center; gap:7px 8px; flex-wrap:wrap; margin-bottom:28px; }
  .job-chip{ font-size:11px; color:var(--jade-dark); border:1px solid rgba(79,111,82,0.35); padding:4px 9px; border-radius:2px; background:rgba(79,111,82,0.06); }
  button.primary{
    display:block; width:100%; padding:15px 20px;
    background:var(--ink); color:var(--paper-card);
    border:none; border-radius:2px; font-family:'Noto Serif KR', serif;
    font-size:15px; letter-spacing:0.08em; cursor:pointer;
    transition:background 0.2s ease, transform 0.15s ease;
  }
  button.primary:hover{background:var(--jade-dark);}
  button.primary:active{transform:scale(0.98);}
  button.ghost{
    display:block; width:100%; margin-top:10px; padding:13px 20px;
    background:transparent; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:2px;
    font-family:'Noto Serif KR', serif; font-size:13px; cursor:pointer;
  }

  .progress-row{ display:flex; gap:4px; margin-bottom:24px; margin-top:6px; }
  .progress-dot{ flex:1; height:3px; background:rgba(43,36,29,0.12); border-radius:2px; overflow:hidden; }
  .progress-dot > span{ display:block; height:100%; width:0; background:var(--danchung); transition:width 0.3s ease; }
  .q-count{ text-align:center; font-size:11px; letter-spacing:0.2em; color:var(--ink-soft); margin-bottom:8px; }
  h2.question{ font-family:'Song Myung', serif; font-size:20px; line-height:1.5; text-align:center; margin:0 0 24px; color:var(--ink); }
  .options{display:flex; flex-direction:column; gap:10px;}
  .option{
    text-align:left; padding:14px 16px; background:var(--paper);
    border:1px solid var(--line); border-radius:2px; cursor:pointer;
    font-family:'Noto Serif KR', serif; font-size:14.5px; color:var(--ink);
    transition:border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .option:hover{border-color:var(--jade); background:rgba(79,111,82,0.06);}
  .option:active{transform:scale(0.99);}
  .likert-option{ text-align:center; font-weight:500; letter-spacing:0.02em; }

  .portrait{
    width:150px; height:150px; margin:4px auto 16px;
    border-radius:6px; overflow:hidden;
    border:2px solid var(--danchung); box-shadow:0 4px 14px rgba(43,36,29,0.22);
    position:relative;
  }
  .portrait img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:sepia(0.08) saturate(0.92) contrast(1.03);
  }
  .portrait::after{
    content:""; position:absolute; inset:0; border:1px solid rgba(255,255,255,0.25); pointer-events:none;
  }
  .result-eyebrow{ text-align:center; font-size:12px; letter-spacing:0.3em; color:var(--ink-soft); margin-bottom:8px; }
  .class-tag{
    display:block; width:fit-content; margin:0 auto 10px; font-size:11px;
    padding:3px 10px; border-radius:20px; background:rgba(166,58,50,0.10);
    color:var(--danchung); border:1px solid rgba(166,58,50,0.3);
  }
  h1.result-title{ font-family:'Song Myung', serif; font-size:28px; text-align:center; margin:0 0 4px; color:var(--ink); }
  .result-sub{ text-align:center; color:var(--jade-dark); font-size:14px; margin-bottom:20px; font-weight:600; }
  .result-desc{ font-size:14.5px; line-height:1.85; color:var(--ink); margin-bottom:20px; text-align:center; }
  .traits{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .trait{ font-size:12px; padding:5px 11px; border-radius:20px; background:rgba(200,155,60,0.14); color:#8a6a20; border:1px solid rgba(200,155,60,0.35); }
  .modern-box{ background:var(--paper); border-left:3px solid var(--jade); padding:12px 16px; font-size:13px; color:var(--ink-soft); line-height:1.7; margin-bottom:26px; }
  .modern-box b{color:var(--jade-dark);}
  .actions{display:flex; gap:8px;}
  .actions button{flex:1;}
  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:4px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:10;
  }
  .toast.show{opacity:1;}

  .site-footer{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    text-align:center; padding:10px 0 12px;
    background:linear-gradient(to top, rgba(239,227,195,0.95), rgba(239,227,195,0));
  }
  .site-footer a, .site-footer span{ font-size:10.5px; color:rgba(43,36,29,0.45); text-decoration:underline; }

  .loading-wrap{ padding:40px 0; text-align:center; }
  .loading-spinner{
    font-size:40px; display:inline-block;
    animation:spin 1.4s linear infinite;
  }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .loading-text{ margin-top:18px; font-size:14px; color:var(--ink-soft); letter-spacing:0.05em; }

  .rarity-box{
    text-align:center; font-size:12.5px; color:var(--jade-dark);
    background:rgba(79,111,82,0.08); border:1px solid rgba(79,111,82,0.25);
    border-radius:20px; padding:6px 14px; width:fit-content; margin:0 auto 18px;
  }
  .mismatch-box{
    background:rgba(166,58,50,0.06); border:1px dashed rgba(166,58,50,0.35);
    padding:12px 16px; font-size:12.5px; color:var(--ink-soft); line-height:1.7;
    margin-bottom:20px; border-radius:2px;
  }
  .mismatch-box b{ color:var(--danchung); }
</style>
</head>

<div class="bg-deco">
  <div class="bg-mountain">
    <svg width="100%" height="130" viewBox="0 0 800 130" preserveAspectRatio="none">

      <path d="M120 45 C110 55 100 60 90 62" stroke="#2b241d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <div class="divider"></div>
    <div class="job-preview">
      <span class="job-chip">👑 임금</span><span class="job-chip">📜 정승</span>
      <span class="job-chip">⚔️ 무관</span><span class="job-chip">✍️ 사관</span>

<script>
// 직업당 2개씩, 총 32개 문장 풀. 테스트할 때마다 16개 직업 중 12개를 랜덤으로 고르고,
// 고른 직업마다 문장을 랜덤으로 하나씩 뽑아서 보여줌 -> 매번 다른 조합, 같은 사람이 여러 번 해도 안 질림.
// 결과는 그 12문항 응답값 그대로 결정됨(직업별 점수 = 해당 문장에 준 점수, 1~5점). 랜덤 아님 — 단, 그 회차에 아예
// 등장하지 않은 직업(16개 중 나머지 4개)은 이번엔 결과가 될 수 없음.
const QUESTIONS_PER_TEST = 12;

const statementPool = {
  "임금": [
    "나는 단톡방에서 공지 올리고 방향을 정하는 사람이다",
    "나는 결정 장애가 없고, 웬만한 건 내가 정하고 책임진다"
  ],
  "정승": [
    "나는 회의 때는 조용하지만, 속으로는 이미 계산을 다 끝내둔 사람이다",
    "나는 나서는 것보다 뒤에서 판을 읽는 게 편하다"
  ],
  "무관": [
    "나는 힘든 일이 생기면 일단 내가 먼저 나서는 편이다",
    "나는 팀에 문제가 생기면 총대를 메는 편이다"
  ],
  "사관": [
    "나는 지난 대화를 스크롤해서 팩트체크하는 걸 좋아한다",
    "나는 기록, 정리, 정산 이런 건 나만 믿으라고 자신 있게 말할 수 있다"
  ],
  "도사": [
    "나는 혼자 있는 시간에 진짜 에너지를 얻는 사람이다",
    "나는 유행보다 본질이 궁금해서 혼자 파고드는 편이다"
  ],
  "훈장": [
    "나는 뭔가 알게 되면 옆 사람한테 알려줘야 직성이 풀린다",
    "나는 누가 모르는 걸 물어보면 신나서 설명해주는 편이다"
  ],
  "천문관": [
    "나는 원리가 궁금하면 검색하다가 새벽까지 파고든다",
    "나는 뭔가의 원리가 안 풀리면 잠을 설칠 정도로 궁금해한다"
  ],
  "역관": [
    "나는 낯선 언어나 문화에 겁 없이 뛰어드는 편이다",
    "나는 새로운 나라, 언어, 문화를 접하면 일단 뛰어들고 본다"
  ],
  "의원": [
    "나는 힘들어하는 사람을 보면 상태부터 살피고 챙긴다",
    "나는 주변 사람 컨디션을 은근히 잘 캐치하는 편이다"
  ],
  "농부": [
    "나는 묵묵히 내 할 일을 하는 편이고, 화분이나 식물도 잘 돌본다",
    "나는 꾸준하고 성실하다는 말을 자주 듣는다"
  ],
  "화공": [
    "나는 말보다 그림이나 플레이리스트로 마음을 표현하는 게 편하다",
    "나는 인테리어나 소품, 무드에 은근히 신경 쓰는 편이다"
  ],

let current = 0;
let scores = {};
let activeStatements = [];

function $(id){ return document.getElementById(id); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }

function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(){
  current = 0;
  scores = {};
  Object.keys(jobs).forEach(j => scores[j] = 0);
  // 16개 직업 중 12개를 랜덤으로 고르고, 고른 직업마다 문장 풀에서 하나씩 랜덤으로 뽑음
  const chosenJobs = shuffleArray(Object.keys(statementPool)).slice(0, QUESTIONS_PER_TEST);
  activeStatements = shuffleArray(chosenJobs.map(job => {
    const variants = statementPool[job];
    const t = variants[Math.floor(Math.random() * variants.length)];
    return { job, t };
  }));
  buildProgress();
  showScreen('screen-quiz');
  renderQuestion();
}

function buildProgress(){
  const row = $('progressRow');
  row.innerHTML = '';
  activeStatements.forEach(() => {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.innerHTML = '<span></span>';
    row.appendChild(dot);
  });
}

function updateProgress(){
  const dots = document.querySelectorAll('.progress-dot > span');
  dots.forEach((d, i) => { d.style.width = i <= current ? '100%' : '0%'; });
}

function renderQuestion(){
  const item = activeStatements[current];
  $('qCount').textContent = (current+1) + ' / ' + activeStatements.length;
  $('qText').textContent = item.t;
  updateProgress();
  const box = $('qOptions');
  box.innerHTML = '';
  likertLabels.forEach((label, idx) => {
    const value = idx + 1; // 1~5
    const btn = document.createElement('button');
    btn.className = 'option likert-option';
    btn.textContent = label;
    btn.onclick = () => selectOption(item.job, value);
    box.appendChild(btn);
  });
}

function selectOption(job, value){
  scores[job] = (scores[job] || 0) + value;
  current++;
  if (current < activeStatements.length){ renderQuestion(); }
  else { runLoading(); }
}

const loadingPhrases = ["사주를 살피는 중...", "운명을 점치는 중...", "직업을 정하는 중..."];

function runLoading(){
  showScreen('screen-loading');
  let i = 0;
  $('loadingText').textContent = loadingPhrases[0];
  const interval = setInterval(() => {
    i++;
    if (i < loadingPhrases.length){ $('loadingText').textContent = loadingPhrases[i]; }
  }, 600);
  setTimeout(() => { clearInterval(interval); showResult(); }, 2000);
}

function computeJob(){
  let bestScore = -1;
  Object.keys(jobs).forEach(job => { if (scores[job] > bestScore) bestScore = scores[job]; });
  const tied = Object.keys(jobs).filter(job => scores[job] === bestScore);
  return tied[Math.floor(Math.random() * tied.length)];
}

let cachedShareFile = null;

function showResult(){
  const job = computeJob();
  const r = jobs[job];
  $('resultImg').src = r.img;
  $('resultImg').alt = job;
  $('resultClass').textContent = r.cls;
  $('resultTitle').textContent = r.emoji + ' ' + job;
  $('resultSub').textContent = r.sub;
  $('resultDesc').textContent = r.desc;
  $('resultModern').innerHTML = r.modern;
  const traitsBox = $('resultTraits');
  traitsBox.innerHTML = '';
  r.traits.forEach(t => {
    const span = document.createElement('span');
    span.className = 'trait';
    span.textContent = t;
    traitsBox.appendChild(span);
  });
  $('rarityBox').textContent = "이 직업이 나올 확률 " + r.rarity + "% · 낮을수록 레어템";
  const m = jobs[r.mismatch];
  $('mismatchBox').innerHTML = "안 맞는 직업: <b>" + m.emoji + " " + r.mismatch + "</b> — " + r.mismatchReason;
  showScreen('screen-result');
  preCaptureShareImage();
}

function restart(){ showScreen('screen-start'); }

// 결과 화면에 들어오자마자 미리 캡처해서 준비해둠(공유 버튼 클릭 시 지연 없이 바로 공유창이 뜨도록,
// 클릭과 공유 API 호출 사이 시간이 벌어지면 iOS 등에서 "사용자가 방금 눌렀다"는 권한이 만료돼
// 공유창이 안 뜨고 조용히 다운로드로만 빠지는 문제가 있어서 이렇게 처리함)
function preCaptureShareImage(){
  cachedShareFile = null;
  if (typeof html2canvas === 'undefined') return;
  html2canvas($('captureArea'), { backgroundColor: "#faf4e3", scale: 2 }).then(canvas => {
    canvas.toBlob(blob => {
      if (blob){
        cachedShareFile = new File([blob], "조선시대_직업_테스트_결과.png", { type: "image/png" });
      }
    }, "image/png");
  }).catch(() => { /* 실패하면 클릭 시점에 재시도(아래 shareResult의 폴백 경로) */ });
}

function shareResult(btn){
  const title = $('resultTitle').textContent;
  const sub = $('resultSub').textContent;
  const text = "당신이 조선시대에서 살았다면, 당신의 직업은?\n[조선시대 직업 테스트]\n나의 결과는 '" + title + "' — " + sub + "\n너의 결과도 궁금하다면 테스트 해보세요."\nhttps://myfortunetoday.com/job-test/";
  const originalText = btn.textContent;
  const done = () => { btn.textContent = originalText; btn.disabled = false; };

  // 1순위: 미리 캡처해둔 이미지가 있으면 지연 없이 바로 공유 (가장 안정적으로 카톡/인스타 공유창이 뜸)
  if (cachedShareFile && navigator.canShare && navigator.canShare({ files: [cachedShareFile] })){
    btn.disabled = true;
    navigator.share({ files: [cachedShareFile], title: "조선시대 직업 테스트", text: text })
      .catch(() => { downloadFile(cachedShareFile); })
      .finally(done);
    return;
  }
  // 2순위: 파일 공유는 안 되지만 텍스트/링크 공유는 되는 환경
  if (navigator.share){
    btn.disabled = true;
    navigator.share({ title: "조선시대 직업 테스트", text: text, url: location.href })
      .catch(() => { fallbackTextShare(text); })
      .finally(done);
    return;
  }

  // 3순위: 공유 API 자체가 없는 환경(PC, 구형 브라우저, 인앱 브라우저 등) — 그 자리에서 캡처해서 다운로드
  btn.textContent = "준비하는 중...";
  btn.disabled = true;
  if (typeof html2canvas === 'undefined'){ fallbackTextShare(text); done(); return; }
  html2canvas($('captureArea'), { backgroundColor: "#faf4e3", scale: 2 }).then(canvas => {
    canvas.toBlob(blob => {
      if (!blob){ fallbackTextShare(text); done(); return; }
      downloadFile(new File([blob], "조선시대_직업_테스트_결과.png", { type: "image/png" }));
      done();
    }, "image/png");
  }).catch(() => { fallbackTextShare(text); done(); });
}

function downloadFile(file){
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.download = file.name;
  link.href = url;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast("결과 이미지가 저장되었습니다");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(
      "당신이 조선시대에서 살았다면, 당신의 직업은?\n너의 결과도 궁금하다면 테스트 해보세요."
    ).catch(() => {});
  }
}

function fallbackTextShare(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      showToast("결과가 복사되었습니다");
    }).catch(() => { window.prompt("아래 문구를 복사해서 공유해보세요", text); });
  } else {
    window.prompt("아래 문구를 복사해서 공유해보세요", text);
  }
}

function showToast(msg){
  const toast = $('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}
</script>
</body>
</html>
